<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2bd28">
<title>Bar La Perdiz | Nuestra carta</title>
<style>
:root{--amarillo:#f2bd28;--negro:#111}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--amarillo);color:var(--negro);font-family:Arial,Helvetica,sans-serif}
main{width:min(100%,520px);text-align:center}
.logo{display:block;width:100%;height:auto;margin:0 auto 28px;border-radius:8px}
h1{font-size:clamp(1.6rem,6vw,2.2rem);margin:0 0 12px}
p{font-size:1.1rem;margin:0 0 28px}
.button{display:inline-block;width:100%;padding:19px 16px;border:3px solid var(--negro);border-radius:12px;background:var(--negro);color:white;text-decoration:none;font-size:1.15rem;font-weight:800;letter-spacing:.03em}
.note{margin-top:18px;font-size:.9rem;line-height:1.45}
</style>
</head>
<body>
<main>
<img class="logo" src="logo-bar-la-perdiz.jpg" alt="Bar La Perdiz">
<h1>¡Bienvenido!</h1>
<p>Consulta nuestra carta desde tu móvil.</p>
<a class="button" href="app/bar-la-perdiz-clientes.apk">DESCARGAR NUESTRA CARTA</a>
<div class="note">La descarga es para móviles Android. Después, abre el archivo descargado para instalar la aplicación.</div>
</main>
</body>
</html>
